<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Book Vibe</title>
</head>
<body>
    <header>
        <nav class="flex justify-between items-center mt-6">
            <h3 class="font-bold text-[28px] text-[#131313] text-nowrap ml-6">Book Vibe</h3>
            <ul class="hidden lg:flex items-center gap-4">
                <li class="font-semibold text-[#23BE0A] border border-[#23BE0A] px-3.5 py-3 rounded-lg">Home</li>
                <li>Listed Books</li>
                <li>Pages to read</li>
            </ul>
<div class="flex gap-3">
    <button class="font-semibold text-[18px] text-[#FFFFFF] bg-[#23BE0A] px-4 py-3 rounded-2xl text-nowrap">Sign In</button>
<button class="font-semibold text-[18px] text-[#FFFFFF] bg-[#59C6D2] px-4 py-3 rounded-2xl text-nowrap mr-6">Sign Up</button>
</div>
</nav>
</header>
<main>
<!--Hero Section-->
<section class="bg-[#131313]/5 rounded-2xl ml-13 -mt-85">
<h3 class="font-bold text-[#131313] text-4xl flex flex-col justify-end ml-42 mt-90">Books to freshen up your bookshelf</h3>
<div>
    <button class="font-bold text-[20px] text-[#FFFFFF] bg-[#23BE0A] px-4 py-3 rounded-2xl text-nowrap ml-45 mt-55">View the list</button>
</div> 
<div>
    <img src="assets/Banner.png" alt="" class="ml-200 -mt-90">
</div>
</section>
<div class="flex justify-center items-center">
    <h3 class="font-bold text-[#131313] text-[40px]">Books</h3>
</div>
<!--Card Section-->
<section class="grid-cols-1 md:grid-cols-2 lg:grid-cols-3" >
<div class="px-6 py-6 border border-[#131313]/15 rounded-4xl">
    <div class="w-full h-55 rounded-3xl bg-[#F3F3F3]">
        <div class="p-4 ml-14">
            <img src="assets/book1.png" alt="" class="object-cover mt-4 ml-4">
        </div>
        <div>
             <button class="font-medium text-[16px] text-[#23BE0A] bg-[#23BE0A]/5 px-4 py-1.75 rounded-4xl gap-10 mt-2">Young Adult</button>
            <button class="font-medium text-[16px] text-[#23BE0A] bg-[#23BE0A]/5 px-4 py-3 rounded-4xl gap-10 mt-2">Identity</button>
            </div>
            <h3 class="font-bold text-[24px] text-[#131313] mt-4">The Catcher in the Rye</h3>
            <p class="font-medium text-[16px] text-[#131313] mt-4">By: Awlad Hossain</p>
            <hr class="border border-dotted mt-4">
            <div class="flex justify-between mt-6">
                <p class="font-medium text-[16px] text-[#131313]/80">Fiction</p>
                <p class="font-medium text-[16px] text-[#131313]/80">5.00</p>
                
                    <img src="assets/Vector.png" alt="" class="text-[#424242]">
                
            </div>

    </div>
</div>

</section>


</main>
</body>
</html>
